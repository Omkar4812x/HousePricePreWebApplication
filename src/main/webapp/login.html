<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - House Price Prediction</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
    body {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
    }
    .glass-card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 3rem;
        width: 100%;
        max-width: 450px;
        box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
    }
    .text-gradient {
        background: linear-gradient(to right, #00c6ff, #0072ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 700;
    }
    .form-control {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #fff;
        border-radius: 10px;
        padding: 12px 20px;
        transition: all 0.3s;
    }
    .form-control::placeholder {
        color: rgba(255, 255, 255, 0.5);
    }
    .form-control:focus {
        background: rgba(255, 255, 255, 0.15);
        border-color: #00c6ff;
        box-shadow: 0 0 15px rgba(0, 198, 255, 0.3);
        color: #fff;
    }
    .btn-login {
        background: linear-gradient(to right, #00c6ff, #0072ff);
        border: none;
        border-radius: 10px;
        padding: 12px;
        font-weight: 600;
        letter-spacing: 1px;
        transition: all 0.3s;
        color: white;
    }
    .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(0, 198, 255, 0.4);
    }
    .custom-link {
        color: #00c6ff;
        text-decoration: none;
        transition: color 0.3s;
    }
    .custom-link:hover {
        color: #fff;
        text-decoration: underline;
    }
    .alert-glass {
        background: rgba(220, 53, 69, 0.2);
        border: 1px solid #dc3545;
        color: #ff8a94;
        border-radius: 10px;
        display: none;
    }
</style>
</head>
<body>

<div class="glass-card">
    <div class="text-center mb-4">
        <h2 class="text-gradient mb-2">House Price Prediction</h2>
        <p class="text-white-50">Welcome back! Please login.</p>
    </div>

    <!-- Error message alert, initially hidden -->
    <div id="error-msg" class="alert alert-glass text-center p-2 mb-4">
        Invalid username or password.
    </div>

    <!-- Successful logout message, initially hidden -->
    <div id="logout-msg" class="alert alert-success text-center p-2 mb-4" style="display: none; background: rgba(25, 135, 84, 0.2); border: 1px solid #198754; color: #a3cfbb; border-radius: 10px;">
        Logged out successfully.
    </div>

    <form name="frm" action="validateadmin" method="POST">
        <div class="mb-4">
            <label class="form-label text-white-50 small text-uppercase fw-bold">Username</label>
            <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
        </div>
        <div class="mb-4">
            <label class="form-label text-white-50 small text-uppercase fw-bold">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
        </div>
        <div class="d-grid mt-5">
            <button type="submit" class="btn btn-login btn-block">LOGIN</button>
        </div>
    </form>

    <div class="text-center mt-4">
        <p class="text-white-50 mb-0">Don't have an account? <a href="register" class="custom-link fw-bold">Sign up here</a></p>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    if(urlParams.get('error') === '1') {
        document.getElementById('error-msg').style.display = 'block';
    }
    if(urlParams.get('logout') === '1') {
        document.getElementById('logout-msg').style.display = 'block';
    }
</script>

</body>
</html>
