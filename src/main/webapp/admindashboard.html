<style>
  /* ========================================================= */
  /*  ULTRA PREMIUM GLASSMORPHISM SYSTEM (Overrides everything) */
  /* ========================================================= */
  body {
      font-family: 'Inter', sans-serif !important;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364) fixed !important;
      color: #fff !important;
      min-height: 100vh;
      margin: 0;
  }
  
  /* Global Card Styling (Applies to all dynamically generated cards) */
  .card, .bg-light, .bg-dark, .bg-white, .bg-primary, .bg-success, .bg-danger, .bg-warning, .bg-info, .bg-secondary {
      background: rgba(255, 255, 255, 0.05) !important;
      backdrop-filter: blur(15px) !important;
      -webkit-backdrop-filter: blur(15px) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2) !important;
      color: #fff !important;
      border-radius: 15px !important;
  }
  .card-header {
      background: rgba(255, 255, 255, 0.1) !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
      color: #00c6ff !important;
      border-top-left-radius: 15px !important;
      border-top-right-radius: 15px !important;
      font-weight: 700 !important;
  }
  
  /* Global Table Styling */
  .table {
      color: #fff !important;
      --bs-table-bg: transparent !important;
      --bs-table-color: #fff !important;
      --bs-table-hover-bg: rgba(255, 255, 255, 0.1) !important;
      --bs-table-border-color: rgba(255, 255, 255, 0.1) !important;
  }
  .table-dark {
      --bs-table-bg: rgba(0,0,0,0.3) !important;
  }
  tbody tr {
      transition: all 0.3s ease;
  }
  tbody tr:hover {
      background: rgba(255, 255, 255, 0.1) !important;
      transform: scale(1.01);
  }

  /* Global Form Styling */
  .form-control, .form-select {
      background: rgba(255, 255, 255, 0.08) !important;
      border: 1px solid rgba(255, 255, 255, 0.2) !important;
      color: #fff !important;
      border-radius: 10px !important;
      padding: 12px !important;
      transition: all 0.3s ease !important;
  }
  .form-control:focus, .form-select:focus {
      background: rgba(255, 255, 255, 0.15) !important;
      border-color: #00c6ff !important;
      box-shadow: 0 0 15px rgba(0, 198, 255, 0.3) !important;
      color: #fff !important;
  }
  .form-control::placeholder {
      color: rgba(255, 255, 255, 0.4) !important;
  }
  option {
      background: #203a43 !important;
      color: #fff !important;
  }
  label {
      color: #ddd !important;
      font-weight: 600 !important;
      font-size: 0.9rem !important;
      text-transform: uppercase !important;
      letter-spacing: 1px !important;
  }

  /* Global Button Styling */
  .btn {
      border-radius: 10px !important;
      font-weight: 600 !important;
      letter-spacing: 1px !important;
      transition: all 0.3s ease !important;
  }
  .btn-primary, .btn-success, .btn-dark, .btn-warning, .btn-info {
      background: linear-gradient(to right, #00c6ff, #0072ff) !important;
      border: none !important;
      color: #fff !important;
  }
  .btn-primary:hover, .btn-success:hover, .btn-dark:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 198, 255, 0.4) !important;
  }
  .btn-danger {
      background: linear-gradient(to right, #ff416c, #ff4b2b) !important;
      border: none !important;
      color: #fff !important;
  }
  .btn-danger:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(255, 65, 108, 0.4) !important;
  }

  /* Global Navbar Styling */
  .navbar {
      background: rgba(0, 0, 0, 0.4) !important;
      backdrop-filter: blur(20px) !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
      padding: 15px 0 !important;
  }
  .navbar-brand {
      color: #fff !important;
      font-weight: 700 !important;
      font-size: 1.5rem !important;
      letter-spacing: 1px !important;
      text-shadow: 0 0 10px rgba(255,255,255,0.3);
  }
  .nav-link {
      color: #ccc !important;
      font-weight: 600 !important;
      transition: color 0.3s !important;
      margin: 0 5px;
  }
  .nav-link:hover, .nav-link:focus {
      color: #00c6ff !important;
  }
  .dropdown-menu {
      background: rgba(20, 35, 45, 0.95) !important;
      backdrop-filter: blur(20px) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      border-radius: 12px !important;
  }
  .dropdown-item {
      color: #ccc !important;
      transition: all 0.2s !important;
  }
  .dropdown-item:hover {
      background: rgba(255, 255, 255, 0.1) !important;
      color: #00c6ff !important;
  }

  /* Override text colors on all child servlets */
  .text-dark, .text-muted, .text-success, h1, h2, h3, h4, h5, h6 {
      color: #fff !important;
  }
  .text-gradient {
      background: linear-gradient(to right, #00c6ff, #0072ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
  }
</style>
</head>
